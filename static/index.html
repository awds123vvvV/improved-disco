<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rust Edge Control Center</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2 { color: #38bdf8; margin-top: 0; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: #94a3b8; }
        input[type="text"], input[type="number"], textarea { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; box-sizing: border-box; }
        .checkbox-group { display: flex; gap: 20px; margin: 16px 0; }
        button { width: 100%; padding: 12px; background: #0284c7; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; }
        button:hover { background: #0369a1; }
        .sub-link { margin-top: 20px; padding: 12px; background: #0f172a; border: 1px dashed #38bdf8; border-radius: 6px; word-break: break-all; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Rust Worker 控制面板</h2>
        <div class="form-group">
            <label>UUID</label>
            <input type="text" id="uuid">
        </div>
        <div class="form-group">
            <label>优选 IP / 域名 (每行一个)</label>
            <textarea id="addresses" rows="4"></textarea>
        </div>
        <div class="form-group">
            <label>端口</label>
            <input type="number" id="port">
        </div>
        <div class="form-group">
            <label>传输 Path</label>
            <input type="text" id="path">
        </div>
        <div class="checkbox-group">
            <label><input type="checkbox" id="enable_vless"> 开启 VLESS</label>
            <label><input type="checkbox" id="enable_trojan"> 开启 Trojan</label>
        </div>
        <button onclick="saveConfig()">保存配置到 KV</button>

        <div class="sub-link">
            <strong>v2rayN 订阅地址：</strong>
            <span id="subUrl">加载中...</span>
        </div>
    </div>

    <script>
        async function loadConfig() {
            const res = await fetch('/api/config');
            const data = await res.json();
            document.getElementById('uuid').value = data.uuid;
            document.getElementById('addresses').value = data.addresses.join('\n');
            document.getElementById('port').value = data.port;
            document.getElementById('path').value = data.path;
            document.getElementById('enable_vless').checked = data.enable_vless;
            document.getElementById('enable_trojan').checked = data.enable_trojan;
            
            document.getElementById('subUrl').innerText = `${window.location.origin}/sub/${data.uuid}`;
        }

        async function saveConfig() {
            const payload = {
                uuid: document.getElementById('uuid').value,
                addresses: document.getElementById('addresses').value.split('\n').filter(i => i.trim() !== ''),
                port: parseInt(document.getElementById('port').value),
                path: document.getElementById('path').value,
                enable_vless: document.getElementById('enable_vless').checked,
                enable_trojan: document.getElementById('enable_trojan').checked
            };
            const res = await fetch('/api/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (res.ok) {
                alert('保存成功！');
                loadConfig();
            } else {
                alert('保存失败，请检查 KV 绑定');
            }
        }
        loadConfig();
    </script>
</body>
</html>
