[package]
name = "cf-terminal-worker"
version = "3.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = "0.0.18" # Cloudflare Worker Rust SDK
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
regex = "0.1"
rand = "0.8"
url = "2.4"
getrandom = { version = "0.2", features = ["js"] }
