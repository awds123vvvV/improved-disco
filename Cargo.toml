[package]
name = "cf-v2ray-rust-full"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = "0.0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
urlencoding = "2.1"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
